    display:none;
    padding:64px 88px;
    flex-direction:column;
    justify-content:flex-start;
  }
  .slide.active{display:flex;}
  .kicker{
    color:var(--accent);

    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:600;

  h2{font-size:34px;margin:0 0 4px 0;font-weight:800;}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;}

    background:var(--panel);
    border:1px solid var(--border);

    padding:22px 24px;
  }

  .tag{
    display:inline-block;background:var(--panel2);color:var(--accent2);
    border:1px solid var(--border);border-radius:20px;padding:3px 12px;
    font-size:12.5px;margin:2px 4px 2px 0;font-weight:600;
  }
  .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;background:var(--accent);
    color:#fff;font-weight:800;font-size:15px;margin-right:10px;flex-shrink:0;

  .step{display:flex;align-items:flex-start;margin-bottom:14px;}
  .step-text{font-size:15.5px;line-height:1.6;}
  .step-text b{color:var(--accent2);}
  .big-list{list-style:none;margin:0;padding:0;}
  .big-list li{

  .section-title{font-size:64px;font-weight:800;margin:0;}
  .section-sub{color:var(--sub);font-size:20px;margin-top:14px;}
  .section-index{font-size:120px;font-weight:900;color:var(--panel2);position:absolute;top:60px;right:90px;}
  .center{align-items:center;justify-content:center;text-align:left;}
  .badge-row{margin-top:18px;}
  table.limits{width:100%;border-collapse:collapse;font-size:14.5px;}
  table.limits th,table.limits td{border:1px solid var(--border);padding:8px 12px;text-align:left;}
  table.limits th{background:var(--panel2);color:var(--accent2);}
  .footer-bar{

    color:var(--text);width:44px;height:44px;border-radius:50%;

  #nextBtn{right:20px;}
  .dots{position:fixed;top:20px;right:30px;font-size:13px;color:var(--sub);z-index:10;}
  .highlight{color:var(--accent);font-weight:700;}

  .quote{
    border-left:4px solid var(--accent);padding:6px 18px;color:var(--sub);

</head>

slides.push(`

slides.push(`

<div class="divider"></div>

      <li><b>cloudflared</b>：仅发起出站连接，接入 Cloudflare 隧道边缘节点</li>
      <li><b>代理（proxy）</b>：用客户自有证书终止内层 TLS，校验来源 IP，按主机名路由到目标 MCP 服务器</li>
    </ul>
    <p>流量路径：Claude → 外层 mTLS → 隧道边缘 → cloudflared → 代理终止内层 TLS → 上游 MCP 服务器</p>
  </div>
  <div class="card">
    <h3>安全模型 & 使用要求</h3>
    <ul>
      <li>三层独立安全机制：外层 mTLS/IP 校验、内层 TLS、MCP 服务器自身的 OAuth</li>
      <li>Cloudflare 只能看到出口 IP 与连接时序，<b>无法读取负载内容</b></li>
      <li>需要 Kubernetes 集群或 Docker 环境；推荐工作负载身份联合认证</li>
      <li>研究预览阶段，无正式 SLA/支持承诺</li>
    </ul>
  </div>
</div>
`);

// ---------- Render logic ----------
const deck = document.getElementById('deck');
slides.forEach((html, i)=>{
  const div = document.createElement('div');
  div.className = 'slide' + (i===0 ? ' active' : '');
  div.innerHTML = html;
  deck.appendChild(div);
});

let current = 0;
const total = slides.length;
const slideEls = document.querySelectorAll('.slide');
const pageNum = document.getElementById('pageNum');
const progressBar = document.getElementById('progressBar');

function show(i){
  current = Math.max(0, Math.min(total-1, i));
  slideEls.forEach((el, idx)=> el.classList.toggle('active', idx===current));
  pageNum.textContent = (current+1) + ' / ' + total;
  progressBar.style.width = ((current+1)/total*100) + '%';
}

document.getElementById('nextBtn').addEventListener('click', ()=> show(current+1));
document.getElementById('prevBtn').addEventListener('click', ()=> show(current-1));
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') show(current+1);
  if(e.key === 'ArrowLeft' || e.key === 'PageUp') show(current-1);
});

show(0);
</script>
</body>
</html>
